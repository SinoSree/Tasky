// ---------------------------------------------------------------------------
// Dashboard.jsx — statistics + two short lists (due soon, recently added).
// ---------------------------------------------------------------------------

function Dashboard({ onEdit, onDelete, onNewTask }) {
  const { tasks, categories, members, toggleComplete } = useTasks();

  // useMemo caches the result and only recalculates when `tasks` changes.
  const stats = useMemo(() => getStats(tasks), [tasks]);

  // Unfinished tasks with a due date in the next 7 days (overdue included).
  const dueSoon = useMemo(() => {
    const today = startOfToday();
    const limit = new Date(today); limit.setDate(limit.getDate() + 7);
    return sortTasks(
      tasks.filter((t) => {
        if (t.status === 'done' || !t.dueDate) return false;
        const d = parseDateInput(t.dueDate);
        return d && d <= limit;
      }),
      'dueDate'
    ).slice(0, 4);
  }, [tasks]);

  const recent = useMemo(() => sortTasks(tasks, 'newest').slice(0, 4), [tasks]);

  // How many tasks sit in each status — used for the progress bar.
  const byStatus = STATUSES.map((s) => ({
    ...s,
    count: tasks.filter((t) => t.status === s.id).length,
  }));

  return (
    <div className="page">
      <section className="stat-grid">
        <StatCard label="Total tasks"  value={stats.total}    icon="inbox"    tone="blue" />
        <StatCard label="In progress"  value={stats.progress} icon="trending" tone="amber" />
        <StatCard label="Completed"    value={stats.done}     icon="check"    tone="green"
                  hint={`${stats.completionRate}% of all tasks`} />
        <StatCard label="Overdue"      value={stats.overdue}  icon="alert"    tone="red"
                  hint={stats.dueToday > 0 ? `${stats.dueToday} due today` : undefined} />
      </section>

      <section className="panel">
        <div className="panel-head">
          <h2 className="panel-title">Progress</h2>
          <span className="panel-meta">{stats.completionRate}% complete</span>
        </div>

        {/* The bar: each segment's width is its share of all tasks. */}
        <div className="progress-track">
          {byStatus.map((s) => (
            s.count > 0 && (
              <div
                key={s.id}
                className={`progress-seg seg-${s.id}`}
                style={{ width: `${(s.count / stats.total) * 100}%` }}
                title={`${s.label}: ${s.count}`}
              />
            )
          ))}
          {stats.total === 0 && <div className="progress-seg seg-empty" style={{ width: '100%' }} />}
        </div>

        <div className="progress-legend">
          {byStatus.map((s) => (
            <span key={s.id} className="legend-item">
              <span className={`legend-dot seg-${s.id}`} />
              {s.label} <strong>{s.count}</strong>
            </span>
          ))}
          <span className="legend-item legend-high">
            <Icon name="alert" size={13} /> High priority open <strong>{stats.highPrio}</strong>
          </span>
        </div>
      </section>

      <div className="dash-columns">
        <section className="panel">
          <div className="panel-head">
            <h2 className="panel-title">Due in the next 7 days</h2>
          </div>
          {dueSoon.length === 0 ? (
            <EmptyState icon="calendar" title="Nothing due soon" message="You are all caught up for the week." />
          ) : (
            <div className="card-stack">
              {dueSoon.map((task) => (
                <TaskCard key={task.id} task={task} categories={categories} members={members}
                          onEdit={onEdit} onDelete={onDelete} onToggle={toggleComplete} />
              ))}
            </div>
          )}
        </section>

        <section className="panel">
          <div className="panel-head">
            <h2 className="panel-title">Recently added</h2>
          </div>
          {recent.length === 0 ? (
            <EmptyState icon="inbox" title="No tasks yet"
                        message="Create your first task to get started."
                        actionLabel="New task" onAction={onNewTask} />
          ) : (
            <div className="card-stack">
              {recent.map((task) => (
                <TaskCard key={task.id} task={task} categories={categories} members={members}
                          onEdit={onEdit} onDelete={onDelete} onToggle={toggleComplete} />
              ))}
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// TaskList.jsx — the searchable, filterable, sortable list of every task.
// ---------------------------------------------------------------------------

function TaskList({ filters, onFiltersChange, onEdit, onDelete, onNewTask }) {
  const { tasks, categories, members, toggleComplete, clearCompleted } = useTasks();

  // Filter first, then sort. Recalculated only when the inputs change.
  const visible = useMemo(
    () => sortTasks(filterTasks(tasks, filters), filters.sortBy),
    [tasks, filters]
  );

  const completedCount = tasks.filter((t) => t.status === 'done').length;
  // "Filters are active" = the empty result is caused by the filters, not by
  // an empty task list. The empty state message changes accordingly.
  const hasFilters =
    filters.search.trim() !== '' || filters.status !== 'all' ||
    filters.priority !== 'all' || filters.category !== 'all' || filters.assignee !== 'all';

  return (
    <div className="page">
      <FilterBar filters={filters} onChange={onFiltersChange}
                 categories={categories} members={members} resultCount={visible.length} />

      {completedCount > 0 && (
        <div className="list-toolbar">
          <Button variant="ghost" size="sm" icon="trash" onClick={clearCompleted}>
            Clear {completedCount} completed
          </Button>
        </div>
      )}

      {visible.length === 0 ? (
        hasFilters ? (
          <EmptyState icon="search" title="No matching tasks"
                      message="Try a different search term or reset the filters."
                      actionLabel="Reset filters"
                      onAction={() => onFiltersChange({ search: '', status: 'all', priority: 'all', category: 'all', assignee: 'all', sortBy: filters.sortBy })} />
        ) : (
          <EmptyState icon="inbox" title="No tasks yet"
                      message="Create your first task and it will appear here."
                      actionLabel="New task" onAction={onNewTask} />
        )
      ) : (
        <div className="task-list">
          {visible.map((task) => (
            <TaskRow key={task.id} task={task} categories={categories} members={members}
                     onEdit={onEdit} onDelete={onDelete} onToggle={toggleComplete} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ===== src/pages/KanbanBoard.jsx ===== */
// ---------------------------------------------------------------------------
// KanbanBoard.jsx — three columns, cards you can drag between them.
//
// Drag & drop uses the browser's built-in HTML5 API — no library:
//   1. onDragStart  : remember which task id is moving
//   2. onDragOver   : call preventDefault(), otherwise the browser refuses
//                     to allow a drop at all
//   3. onDrop       : update that task's status
// Buttons under each card do the same thing with a click, so the board is
// still fully usable on a touch screen or with a keyboard.
// ---------------------------------------------------------------------------

function KanbanBoard({ filters, onFiltersChange, onEdit, onDelete, onNewTask }) {
  const { tasks, categories, members, moveTask, toggleComplete } = useTasks();
  const [dragOverCol, setDragOverCol] = useState(null);   // for the highlight

  const visible = useMemo(
    () => sortTasks(filterTasks(tasks, { ...filters, status: 'all' }), filters.sortBy),
    [tasks, filters]
  );

  const handleDragStart = (e, taskId) => {
    // dataTransfer is how the browser carries data from drag to drop.
    e.dataTransfer.setData('text/plain', taskId);
    e.dataTransfer.effectAllowed = 'move';
  };

  const handleDrop = (e, statusId) => {
    e.preventDefault();
    const taskId = e.dataTransfer.getData('text/plain');
    if (taskId) moveTask(taskId, statusId);
    setDragOverCol(null);
  };

  return (
    <div className="page">
      <FilterBar filters={filters} onChange={onFiltersChange}
                 categories={categories} members={members} showStatus={false} resultCount={visible.length} />

      <div className="kanban">
        {STATUSES.map((status) => {
          const columnTasks = visible.filter((t) => t.status === status.id);
          return (
            <section
              key={status.id}
              className={`kanban-col ${dragOverCol === status.id ? 'is-dragover' : ''}`}
              onDragOver={(e) => { e.preventDefault(); setDragOverCol(status.id); }}
              onDragLeave={() => setDragOverCol(null)}
              onDrop={(e) => handleDrop(e, status.id)}
            >
              <div className="kanban-head">
                <span className={`kanban-dot seg-${status.id}`} />
                <h2 className="kanban-title">{status.label}</h2>
                <span className="kanban-count">{columnTasks.length}</span>
              </div>

              <div className="kanban-body">
                {columnTasks.map((task) => (
                  <div key={task.id} className="kanban-item">
                    <TaskCard task={task} categories={categories} members={members}
                              onEdit={onEdit} onDelete={onDelete} onToggle={toggleComplete}
                              draggable onDragStart={handleDragStart} />
                    {/* Click-based alternative to dragging. */}
                    <div className="move-row">
                      {STATUSES.filter((s) => s.id !== status.id).map((s) => (
                        <button key={s.id} className="move-btn"
                                onClick={() => moveTask(task.id, s.id)}>
                          Move to {s.label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}

                {columnTasks.length === 0 && (
                  <p className="kanban-empty">Drop a task here</p>
                )}
              </div>

              {status.id === 'todo' && (
                <Button variant="ghost" size="sm" icon="plus" className="kanban-add" onClick={onNewTask}>
                  Add task
                </Button>
              )}
            </section>
          );
        })}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// CalendarView.jsx — month grid with each task on its due date.
// Click a day to see everything due that day.
// ---------------------------------------------------------------------------

const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

function CalendarView({ onEdit, onDelete, onNewTask }) {
  const { tasks, categories, members, toggleComplete } = useTasks();
  const today = startOfToday();

  // Which month is on screen, and which day the user clicked.
  const [cursor, setCursor] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const [selected, setSelected] = useState(() => toDateInput(today));

  const cells = useMemo(
    () => buildMonthGrid(cursor.getFullYear(), cursor.getMonth()),
    [cursor]
  );

  // Group tasks by due date once, so each cell is a cheap lookup instead of
  // filtering the whole task list 42 times.
  const byDate = useMemo(() => {
    const map = {};
    tasks.forEach((t) => {
      if (!t.dueDate) return;
      (map[t.dueDate] = map[t.dueDate] || []).push(t);
    });
    return map;
  }, [tasks]);

  const shiftMonth = (delta) =>
    setCursor((c) => new Date(c.getFullYear(), c.getMonth() + delta, 1));

  const selectedTasks = byDate[selected] || [];
  const undated = tasks.filter((t) => !t.dueDate);

  return (
    <div className="page">
      <div className="cal-toolbar">
        <div className="cal-nav">
          <button className="icon-btn" onClick={() => shiftMonth(-1)} aria-label="Previous month">
            <Icon name="chevronL" size={18} />
          </button>
          <h2 className="cal-month">
            {cursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}
          </h2>
          <button className="icon-btn" onClick={() => shiftMonth(1)} aria-label="Next month">
            <Icon name="chevronR" size={18} />
          </button>
        </div>
        <Button variant="secondary" size="sm" onClick={() => {
          setCursor(new Date(today.getFullYear(), today.getMonth(), 1));
          setSelected(toDateInput(today));
        }}>Today</Button>
      </div>

      <div className="cal-layout">
        <div className="panel cal-panel">
          <div className="cal-weekdays">
            {WEEKDAYS.map((d) => <span key={d} className="cal-weekday">{d}</span>)}
          </div>

          <div className="cal-grid">
            {cells.map(({ date, inMonth }) => {
              const key = toDateInput(date);
              const dayTasks = byDate[key] || [];
              const isToday = key === toDateInput(today);
              return (
                <button
                  key={key}
                  className={`cal-cell ${inMonth ? '' : 'is-outside'} ${isToday ? 'is-today' : ''} ${selected === key ? 'is-selected' : ''}`}
                  onClick={() => setSelected(key)}
                >
                  <span className="cal-daynum">{date.getDate()}</span>
                  <span className="cal-dots">
                    {dayTasks.slice(0, 3).map((t) => (
                      <span key={t.id} className={`cal-dot dot-${t.priority} ${t.status === 'done' ? 'is-done' : ''}`} />
                    ))}
                    {dayTasks.length > 3 && <span className="cal-more">+{dayTasks.length - 3}</span>}
                  </span>
                </button>
              );
            })}
          </div>
        </div>

        <aside className="panel cal-side">
          <div className="panel-head">
            <h2 className="panel-title">
              {new Date(selected + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}
            </h2>
            <span className="panel-meta">{selectedTasks.length} due</span>
          </div>

          {selectedTasks.length === 0 ? (
            <EmptyState icon="calendar" title="Nothing due this day"
                        message="Pick another date, or add a task for this one."
                        actionLabel="New task" onAction={onNewTask} />
          ) : (
            <div className="card-stack">
              {selectedTasks.map((task) => (
                <TaskCard key={task.id} task={task} categories={categories} members={members}
                          onEdit={onEdit} onDelete={onDelete} onToggle={toggleComplete} />
              ))}
            </div>
          )}

          {undated.length > 0 && (
            <div className="cal-undated">
              <p className="cal-undated-title">{undated.length} task{undated.length === 1 ? '' : 's'} with no due date</p>
            </div>
          )}
        </aside>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Categories.jsx — add / remove categories and see how many tasks use each.
// ---------------------------------------------------------------------------

const SWATCHES = ['#2563eb', '#7c3aed', '#db2777', '#dc2626', '#ea580c', '#059669', '#0891b2', '#475569'];

function Categories() {
  const { tasks, categories, addCategory, deleteCategory } = useTasks();
  const [label, setLabel] = useState('');
  const [color, setColor] = useState(SWATCHES[0]);
  const [error, setError] = useState('');
  const [pendingDelete, setPendingDelete] = useState(null);

  const handleAdd = (e) => {
    e.preventDefault();
    const clean = label.trim();
    if (!clean) { setError('Enter a category name.'); return; }
    const id = clean.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    if (categories.some((c) => c.id === id)) { setError('That category already exists.'); return; }
    addCategory(clean, color);
    setLabel(''); setError('');
  };

  const countFor = (id) => tasks.filter((t) => t.category === id).length;

  return (
    <div className="page">
      <section className="panel">
        <div className="panel-head"><h2 className="panel-title">Add a category</h2></div>

        <form className="cat-form" onSubmit={handleAdd}>
          <div className="field cat-field">
            <input className={`input ${error ? 'input-error' : ''}`} placeholder="Category name, e.g. Marketing"
                   value={label} onChange={(e) => { setLabel(e.target.value); setError(''); }} />
            {error && <p className="field-error">{error}</p>}
          </div>

          <div className="swatches" role="radiogroup" aria-label="Category colour">
            {SWATCHES.map((c) => (
              <button key={c} type="button" role="radio" aria-checked={color === c}
                      className={`swatch ${color === c ? 'is-active' : ''}`}
                      style={{ backgroundColor: c }} onClick={() => setColor(c)}
                      aria-label={`Colour ${c}`} />
            ))}
          </div>

          <Button type="submit" variant="primary" icon="plus">Add</Button>
        </form>
      </section>

      <section className="panel">
        <div className="panel-head">
          <h2 className="panel-title">Your categories</h2>
          <span className="panel-meta">{categories.length} total</span>
        </div>

        <div className="cat-grid">
          {categories.map((c) => {
            const count = countFor(c.id);
            return (
              <div key={c.id} className="cat-card">
                <span className="cat-dot" style={{ backgroundColor: c.color }} />
                <div className="cat-body">
                  <p className="cat-name">{c.label}</p>
                  <p className="cat-count">{count} task{count === 1 ? '' : 's'}</p>
                </div>
                <button className="icon-btn icon-btn-danger" onClick={() => setPendingDelete(c)}
                        aria-label={`Delete ${c.label}`}>
                  <Icon name="trash" size={15} />
                </button>
              </div>
            );
          })}
        </div>
      </section>

      <ConfirmDialog
        open={pendingDelete !== null}
        title="Delete category"
        message={pendingDelete
          ? `Delete "${pendingDelete.label}"? Its ${countFor(pendingDelete.id)} task(s) will move to Work. No task is deleted.`
          : ''}
        onCancel={() => setPendingDelete(null)}
        onConfirm={() => { deleteCategory(pendingDelete.id); setPendingDelete(null); }}
      />
    </div>
  );
}

// ---------------------------------------------------------------------------
// Team.jsx — manage the people tasks can be assigned to.
// Same shape as the Categories page, so the app stays predictable.
// ---------------------------------------------------------------------------

const TEAM_SWATCHES = ['#2563eb', '#7c3aed', '#db2777', '#dc2626', '#ea580c', '#059669', '#0891b2', '#475569'];

function Team() {
  const { tasks, members, addMember, deleteMember } = useTasks();
  const [name, setName] = useState('');
  const [color, setColor] = useState(TEAM_SWATCHES[0]);
  const [error, setError] = useState('');
  const [pendingDelete, setPendingDelete] = useState(null);

  const openCount = (id) => tasks.filter((t) => t.assigneeId === id && t.status !== 'done').length;
  const totalCount = (id) => tasks.filter((t) => t.assigneeId === id).length;

  const handleAdd = async (e) => {
    e.preventDefault();
    const clean = name.trim();
    if (!clean) { setError('Enter a name.'); return; }
    if (members.some((m) => m.name.toLowerCase() === clean.toLowerCase())) {
      setError('Someone with that name is already on the team.'); return;
    }
    await addMember(clean, color);
    setName(''); setError('');
  };

  const unassigned = tasks.filter((t) => !t.assigneeId).length;

  return (
    <div className="page">
      <section className="panel">
        <div className="panel-head"><h2 className="panel-title">Add a team member</h2></div>

        <form className="cat-form" onSubmit={handleAdd}>
          <div className="field cat-field">
            <input className={`input ${error ? 'input-error' : ''}`} placeholder="Full name, e.g. Priya Nair"
                   value={name} onChange={(e) => { setName(e.target.value); setError(''); }} />
            {error && <p className="field-error">{error}</p>}
          </div>

          <div className="swatches" role="radiogroup" aria-label="Avatar colour">
            {TEAM_SWATCHES.map((c) => (
              <button key={c} type="button" role="radio" aria-checked={color === c}
                      className={`swatch ${color === c ? 'is-active' : ''}`}
                      style={{ backgroundColor: c }} onClick={() => setColor(c)}
                      aria-label={`Colour ${c}`} />
            ))}
          </div>

          <Button type="submit" variant="primary" icon="plus">Add</Button>
        </form>
      </section>

      <section className="panel">
        <div className="panel-head">
          <h2 className="panel-title">Your team</h2>
          <span className="panel-meta">
            {members.length} {members.length === 1 ? 'person' : 'people'}
            {unassigned > 0 && ` · ${unassigned} unassigned task${unassigned === 1 ? '' : 's'}`}
          </span>
        </div>

        <div className="cat-grid">
          {members.map((m) => (
            <div key={m.id} className="cat-card">
              <Avatar name={m.name} color={m.color} size={34} />
              <div className="cat-body">
                <p className="cat-name">{m.name}</p>
                <p className="cat-count">
                  {openCount(m.id)} open · {totalCount(m.id)} total
                </p>
              </div>
              <button className="icon-btn icon-btn-danger" onClick={() => setPendingDelete(m)}
                      aria-label={`Remove ${m.name}`}>
                <Icon name="trash" size={15} />
              </button>
            </div>
          ))}
        </div>
      </section>

      <ConfirmDialog
        open={pendingDelete !== null}
        title="Remove team member"
        confirmLabel="Remove"
        message={pendingDelete
          ? `Remove ${pendingDelete.name} from the team? Their ${totalCount(pendingDelete.id)} task(s) become unassigned. No task is deleted.`
          : ''}
        onCancel={() => setPendingDelete(null)}
        onConfirm={() => { deleteMember(pendingDelete.id); setPendingDelete(null); }}
      />
    </div>
  );
}

/* ===== src/App.jsx ===== */
// ---------------------------------------------------------------------------
// App.jsx — the root component.
//
// Provider order matters: AuthProvider must wrap TaskProvider, because
// TaskProvider calls useAuth() to decide where to load data from.
//
//   <AuthProvider>      who is signed in
//     <TaskProvider>    their tasks, team and categories
//       <Shell/>        the actual interface
// ---------------------------------------------------------------------------

const PAGE_META = {
  dashboard:  { title: 'Dashboard',  subtitle: 'An overview of everything on your plate' },
  tasks:      { title: 'All Tasks',  subtitle: 'Search, filter and sort every task' },
  kanban:     { title: 'Kanban',     subtitle: 'Drag a card to change its status' },
  calendar:   { title: 'Calendar',   subtitle: 'See your tasks by due date' },
  team:       { title: 'Team',       subtitle: 'People you can assign tasks to' },
  categories: { title: 'Categories', subtitle: 'Organise tasks into groups' },
};

const DEFAULT_FILTERS = {
  search: '', status: 'all', priority: 'all',
  category: 'all', assignee: 'all', sortBy: 'newest',
};

function Shell() {
  const { categories, members, loading, syncError, dismissSyncError,
          addTask, updateTask, deleteTask } = useTasks();

  const [page, setPage] = useState('dashboard');
  const [filters, setFilters] = useState(DEFAULT_FILTERS);
  const [menuOpen, setMenuOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [pendingDelete, setPendingDelete] = useState(null);

  const openCreate = useCallback(() => setEditing({ task: null }), []);
  const openEdit   = useCallback((task) => setEditing({ task }), []);
  const closeForm  = useCallback(() => setEditing(null), []);

  const handleSubmit = async (values) => {
    if (editing?.task) await updateTask(editing.task.id, values);
    else await addTask(values);
    setEditing(null);
  };

  const confirmDelete = async () => {
    await deleteTask(pendingDelete.id);
    setPendingDelete(null);
  };

  const meta = PAGE_META[page];

  const renderPage = () => {
    const shared = { onEdit: openEdit, onDelete: setPendingDelete, onNewTask: openCreate };
    switch (page) {
      case 'tasks':      return <TaskList    filters={filters} onFiltersChange={setFilters} {...shared} />;
      case 'kanban':     return <KanbanBoard filters={filters} onFiltersChange={setFilters} {...shared} />;
      case 'calendar':   return <CalendarView {...shared} />;
      case 'team':       return <Team />;
      case 'categories': return <Categories />;
      case 'dashboard':
      default:           return <Dashboard {...shared} />;
    }
  };

  return (
    <div className="app">
      <Sidebar current={page} onNavigate={setPage}
               open={menuOpen} onClose={() => setMenuOpen(false)} />

      <main className="main">
        <Topbar title={meta.title} subtitle={meta.subtitle}
                onNewTask={openCreate} onMenu={() => setMenuOpen(true)} />

        {/* A failed save must never pass silently. */}
        {syncError && (
          <div className="sync-error">
            <Icon name="alert" size={16} />
            <span>{syncError}</span>
            <button className="icon-btn" onClick={dismissSyncError} aria-label="Dismiss">
              <Icon name="close" size={15} />
            </button>
          </div>
        )}

        {loading ? <div className="page"><p className="loading-note">Loading your tasks…</p></div> : renderPage()}
      </main>

      <Modal open={editing !== null}
             title={editing?.task ? 'Edit task' : 'New task'}
             onClose={closeForm}>
        {editing !== null && (
          <TaskForm key={editing.task?.id || 'new'}
                    initialTask={editing.task}
                    categories={categories}
                    members={members}
                    onSubmit={handleSubmit}
                    onCancel={closeForm} />
        )}
      </Modal>

      <ConfirmDialog
        open={pendingDelete !== null}
        title="Delete task"
        message={pendingDelete ? `Delete "${pendingDelete.title}"? This cannot be undone.` : ''}
        onCancel={() => setPendingDelete(null)}
        onConfirm={confirmDelete}
      />
    </div>
  );
}

// Decides between the login screen and the app.
function Gate() {
  const { isSignedIn, loading } = useAuth();

  // Without this check the login screen would flash for a moment on every
  // refresh, before Supabase reports the stored session.
  if (loading) {
    return <div className="auth-screen"><p className="loading-note">Loading…</p></div>;
  }
  if (!isSignedIn) return <LoginScreen />;

  return (
    <TaskProvider>
      <Shell />
    </TaskProvider>
  );
}

function App() {
  return (
    <AuthProvider>
      <Gate />
    </AuthProvider>
  );
}

/* ===== mount the app ===== */
createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
